name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'

concurrency:
  group: build-android
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Monotonically increasing so each APK can install over the previous one
      # (in-place update, no uninstall). Shown in the run logs and artifact name.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      # The Android app loads the live site via capacitor.config server.url, so
      # the bundled web assets are unused — a placeholder satisfies `cap sync`'s
      # webDir copy without needing a full static export.
      - name: Prepare web assets placeholder
        run: mkdir -p out && echo '<!doctype html><title>SAK Supervision</title>' > out/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode signing keystore (if configured)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret set — building an unsigned/debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SAK-Supervision.apk"

      - name: Build debug APK (fallback — no keystore secret)
        if: steps.keystore.outputs.signed == 'false'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          mv app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/SAK-Supervision.apk"

      - name: Print version info
        run: 'echo "Built SAK-Supervision.apk — versionName $ANDROID_VERSION_NAME, versionCode $ANDROID_VERSION_CODE"'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAK-Supervision-Android-v${{ env.ANDROID_VERSION_NAME }}
          path: ${{ runner.temp }}/SAK-Supervision.apk
          retention-days: 30

      # Manual runs (Actions → Build Android App → Run workflow) publish the
      # signed APK to the website and bump app-version.json, which switches on
      # the in-app update banner for every installed app. Only public/** is
      # touched, which does not retrigger this workflow.
      - name: Publish APK to website (release)
        if: github.event_name == 'workflow_dispatch' && steps.keystore.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/SAK-Supervision.apk" public/sak-supervision.apk
          printf '{\n  "build": %s,\n  "version": "%s",\n  "url": "/sak-supervision.apk"\n}\n' "$ANDROID_VERSION_CODE" "$ANDROID_VERSION_NAME" > public/app-version.json
          git add public/sak-supervision.apk public/app-version.json
          git commit -m "release: publish signed APK v$ANDROID_VERSION_NAME (auto)"
          git push origin main || (git pull --rebase origin main && git push origin main)
